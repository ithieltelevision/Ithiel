<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000C34">
    
    <!--Titulo pincipal-->
    <title>Ithiel TV | Canal oficial de televisión y contenido cristiano</title>
    
    
    <!-- METADESCRIPCIÓN (El texto que aparece debajo del título en Google) -->
<meta name="description" content="Bienvenidos a Ithiel Televisión. Transmisiones en vivo, cultos, mensajes de esperanza, coros, adoración y momentos especiales en familia.">
    
    <!-- URL CANÓNICA (Evita contenido duplicado y valida el dominio) -->
<link rel="canonical" href="https://ithieltv.pages.dev/">
    
    <!-- para los favicon -->
    <!-- 1. Para la mayoría de navegadores modernos y pestañas (formato SVG) -->
    <link rel="icon" type="image/svg+xml" href="assets/icons/ithieltv.svg">

    <!-- 2. Para compatibilidad con otros navegadores y Google Search (formato PNG cuadrado, ej. 192x192) -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192x192.png">

    <!-- 3. Para compatibilidad tradicional con navegadores antiguos (formato ICO opcional) -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">



    
 <!-- META ETIQUETAS OPEN GRAPH (Facebook, WhatsApp, LinkedIn, etc.) -->
    <!-- META ETIQUETAS OPEN GRAPH (Para que aparezca con la tarjeta grande e imagen) -->
    <meta property="og:site_name" content="Ithiel TV">
    <meta property="og:title" content="Ithiel TV | Canal oficial de televisión y contenido cristiano">
    <meta property="og:description" content="Bienvenidos a Ithiel Televisión. Transmisiones en vivo, cultos, mensajes de esperanza, coros, adoración y momentos especiales en familia.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ithieltv.pages.dev/">
    
    <!-- Imagen grande en formato horizontal (1200x630px recomendado) -->
    <meta property="og:image" content="https://ithieltv.pages.dev/assets/icons/banner-share.jpg">
    <meta property="og:image:secure_url" content="https://ithieltv.pages.dev/assets/icons/banner-share.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Logo e imagen oficial de Ithiel TV">

    <!-- TWITTER CARDS (Para X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Ithiel TV | Canal oficial de televisión y contenido cristiano">
    <meta name="twitter:description" content="Bienvenidos a Ithiel Televisión. Transmisiones en vivo, cultos, mensajes de esperanza, coros, adoración y momentos especiales en familia.">
    <meta name="twitter:image" content="https://ithieltv.pages.dev/assets/icons/banner-share.jpg">








<!-- TWITTER CARDS (Para X / Twitter) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ithiel TV | Canal oficial de televisión y contenido cristiano">
<meta name="twitter:description" content="Bienvenidos a Ithiel Televisión. Transmisiones en vivo, cultos, mensajes de esperanza, coros, adoración y momentos especiales en familia.">
<meta name="twitter:image" content="https://ithieltv.pages.dev/assets/icons/favicon-192x192.png">


    
    

    
    
    
    <!-- DATOS ESTRUCTURADOS JSON-LD (Permite a Google reconocer el nombre del sitio y logo) -->
<script type="application/ld+json">
{
"@context": "https://schema.org",
"@type": "WebSite",
"name": "Ithiel TV",
"alternateName": "Ithiel Television",
"url": "https://ithieltv.pages.dev/"
}
</script>
    
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>


<body id="inicio-top">

<!-- ANIMACIÓN DE ENTRADA -->

<div id="loader" class="loader-wrapper">
    <div class="loader-container">
        
  <!--Logo: Estático en el centro -->
        <img src="assets/icons/ithieltv.svg" class="loader-logo" alt=" Ithiel TV">

        <img src="assets/icons/animacion.png" class="spinner-png" alt="Cargando">

    </div>
</div>





<!-- HEADER barra superior -->
<header>
    <div class="btn-m" id="abrir">☰</div>
    
    <div class="logo-container">
        <button onclick="irAlInicio()" class="logo-btn">
            <img src="assets/icons/ithieltv.svg" alt="Ithiel TV" class="logo-main">
        </button>
    </div>
</header>

<!-- CARRUSEL -->
<section id="inicio"class="hero">
<div class="slider" id="slider">
    <div class="slides" id="slides">
        <div class="slide slide--bienvenida">
            <h3>Bienvenidos a Ithiel Televisión</h3>
        </div>
        <div class="slide slide--esperanza">
            <h3>Mensajes de esperanza</h3>
        </div>
        <div class="slide slide--alabanzas">
            <h3>Coros y alabanzas</h3>
        </div>
        <div class="slide slide--adoracion">
            <h3>Adoración</h3>
        </div>
    </div> <div class="dots" id="dots-container">
        <div class="dot active" onclick="irASlide(0)"></div>
        <div class="dot" onclick="irASlide(1)"></div>
        <div class="dot" onclick="irASlide(2)"></div>
        <div class="dot" onclick="irASlide(3)"></div>
    </div>
</div>
</section>

<!-- SECCIÓN CULTOS -->
<section class="sec">
    <div class="t-sec"><div class="linea"></div>Cultos</div>
    <div class="grid-container">
       
    <div class="grid-card" 
    onclick="abrirImagen
    ('assets/img/imagen1.jpg', 
    'Lema Familia', 
    'Lema de este año 2026.')">
        
            <img src="assets/img/imagen1.jpg" alt="Lema Familia">
            <div class="grid-title">Lema Familia</div>
        </div>
       
        <div class="grid-card" onclick="abrirImagen('assets/img/culto2.jpg','Entrega',
        'Foto de la alabanza hermano alabe el señor')">
            
            <img src="assets/img/culto2.jpg" alt="Hermano alabe al señor">
            <div class="grid-title">Hermano alabe al señor</div>
        </div>
        
        <div class="grid-card" onclick="abrirImagen('assets/img/culto3.jpg', 'Hermano alabe al señor', 'Foto de la alabanza hermano alabe el señor')">
            <img src="assets/img/culto3.jpg" alt="Hermano alabe al señor">
            <div class="grid-title">Hermano alabe al señor</div>
        </div>
    </div>
</section>

<!-- SECCIÓN VISITAS -->
<section class="sec">
    <div class="t-sec"><div class="linea"></div>Visitas</div>
    <div class="grid-container">
       
        <div class="grid-card" onclick="abrirImagen('assets/img/Visita1.jpg', 'Mañanitas', 'Embarcándose después del culto en las mañanitas')">
            <img src="assets/img/Visita1.jpg" alt="Visita">
            <div class="grid-title">Mañanitas</div>
        </div>
       
        <div class="grid-card" onclick="abrirImagen('assets/img/Visita2.jpg', 'Mañanitas', 'Los embarcados después del culto en las mañanitas')">
            <img src="assets/img/Visita2.jpg" alt="Alabanza">
            <div class="grid-title">Mañanitas</div>
        </div>
    </div>
</section>


<!-- SECCIÓN MOMENTOS ESPECIALES -->
<section class="sec" style="margin-top: -10px;"> 
    <div class="t-sec"><div class="linea"></div>Momentos Especiales</div>
    <div class="grid-container">
       
        <div class="grid-card" onclick="abrirImagen('assets/img/momentos1.jpg', 'Cumpleaños de Noris', 'Celebración especial')">
            <img src="assets/img/momentos1.jpg" alt="Cumpleaños">
            <div class="grid-title">Cumpleaños de Noris</div>
        </div>
    </div>
</section>


<!-- MODAL -->
<div id="modalImagen" class="modal-viewer">
    <span class="close-modal" onclick="cerrarImagen()">&times;</span>
    <div class="modal-content">
        <div class="modal-wrapper">
            <img id="imgFull" src="" alt="Imagen Completa">
            <div class="modal-info-container">
                <h2 id="modalTitulo"></h2>
                <p id="modalDescripcion"></p>
                <div class="modal-actions">
                    <a id="btnDescargar" href="" download class="btn-action btn-download">
                        <i class="fas fa-download"></i> Descargar
                    </a>
                    <button id="btnCompartir" class="btn-action btn-share" onclick="compartirContenido()">
                        <i class="fas fa-share-alt"></i> Compartir
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>






<!-- SCRIPTS (orden correcto de carga) -->
<script src="js/carousel.js"></script>
<script src="js/filters.js"></script>
<script src="js/modal.js"></script>
<script src="js/main.js"></script>
<script src="js/include.js"></script>

</body>
</html>
